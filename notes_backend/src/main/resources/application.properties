spring.application.name=notesbackend

# Server
# Preview runs on 3001; bind server here to avoid mismatch.
server.port=3001
server.forward-headers-strategy=framework

# H2 Database Configuration
# In-memory H2 database; keep it alive for the life of the JVM and prevent premature close on exit.
# DB_CLOSE_DELAY=-1 keeps DB until JVM stops; DB_CLOSE_ON_EXIT=FALSE prevents closing on classpath restarts.
spring.datasource.url=jdbc:h2:mem:notesdb;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
# These ensure /api-docs and Swagger UI are reachable and documented.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
